<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>老站接入 ai-slot 示例</title>
    <style>
      /* 演示页的最低限度排版：老站本身零改动，这里只是让默认观感不至于太裸 */
      body {
        margin: 0 auto;
        padding: 48px 32px 64px;
        max-width: 640px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1a1a1a;
        background: #fafafa;
      }
      h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 4px; }
      h1 + p { color: #555; margin: 0 0 20px; }
      h2 { font-size: 20px; margin: 36px 0 0; }
      form.ai-slot-editor { display: flex; gap: 8px; margin: 12px 0 4px; }
      form.ai-slot-editor input[name="prompt"] {
        flex: 1;
        padding: 8px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fff;
      }
      form.ai-slot-editor button {
        padding: 8px 14px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      form.ai-slot-editor button[type="submit"] {
        background: #1a1a1a;
        border-color: #1a1a1a;
        color: #fff;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@ai-slot/registry": "/vendor/registry/index.js",
          "@ai-slot/runtime": "/vendor/runtime/index.js",
          "@ai-slot/adapter-dom": "/vendor/adapter-dom/index.js"
        }
      }
    </script>
    <script type="module">
      import { configureAiSlot } from "@ai-slot/runtime";
      import { registerRenderer } from "@ai-slot/runtime";
      import { createDomRenderer } from "@ai-slot/adapter-dom";
      import { registry } from "/registry-client.mjs";
      import { domComponents } from "/components.mjs";

      registerRenderer("dom", createDomRenderer(domComponents));
      configureAiSlot({ registry });
    </script>
  </head>
  <body>
    <!-- 老站原有内容，一个字不改，直接包进 ai-slot -->
    <ai-slot name="hero" src="/ai-render/hero" editable stream live>
      <h1>我们的产品</h1>
      <p>一个普通的产品介绍</p>
    </ai-slot>

    <ai-slot name="broken" src="/ai-render/broken">
      <h2>兜底：静态内容</h2>
    </ai-slot>
  </body>
</html>
