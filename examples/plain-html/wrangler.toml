name = "ai-slot-demo"
main = "worker.mjs"
compatibility_date = "2026-10-06"
# nodejs_compat 让 ai.mjs 里的动态 import("node:fs/promises") 可打包（Workers 上读不到文件，自动跳过水合之外的用途）
compatibility_flags = ["nodejs_compat"]

# ai-cache.json 以文本内联进 bundle，用于水合预生成缓存（零运行时 LLM 成本的演示路径）
rules = [
  { type = "Text", globs = ["**/ai-cache.json"] },
]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "DEMO"
class_name = "DemoRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DemoRoom"]
