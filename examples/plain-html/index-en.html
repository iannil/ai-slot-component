<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>X100 Headphones - Old Pal Shop</title>
    <style>
      /* Minimal styling for the demo page: the legacy site itself needs zero changes */
      body {
        margin: 0 auto;
        padding: 0 32px 64px;
        max-width: 640px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1a1a1a;
        background: #fafafa;
      }
      .shop-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
        margin-bottom: 28px;
        border-bottom: 1px solid #e5e5e5;
        font-size: 14px;
      }
      .shop-header .logo { font-weight: 700; }
      .shop-header nav { color: #777; display: flex; gap: 16px; }
      h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 4px; }
      h1 + p { color: #555; margin: 0 0 20px; }
      h2 { font-size: 20px; margin: 36px 0 0; }
      h2 + p { color: #555; margin: 4px 0 0; font-size: 14px; }
      .hero-subtitle { color: #c2410c; font-weight: 600; font-size: 18px; margin: 6px 0 20px; }
      form.ai-slot-editor { display: flex; gap: 8px; margin: 12px 0 4px; }
      form.ai-slot-editor input[name="prompt"] {
        flex: 1;
        padding: 8px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fff;
      }
      form.ai-slot-editor button {
        padding: 8px 14px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      form.ai-slot-editor button[type="submit"] {
        background: #1a1a1a;
        border-color: #1a1a1a;
        color: #fff;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@ai-slot/registry": "/vendor/registry/index.js",
          "@ai-slot/runtime": "/vendor/runtime/index.js",
          "@ai-slot/adapter-dom": "/vendor/adapter-dom/index.js"
        }
      }
    </script>
    <script type="module">
      import { configureAiSlot } from "@ai-slot/runtime";
      import { registerRenderer } from "@ai-slot/runtime";
      import { createDomRenderer } from "@ai-slot/adapter-dom";
      import { registry } from "/registry-client.mjs";
      import { domComponents } from "/components.mjs";

      registerRenderer("dom", createDomRenderer(domComponents));
      configureAiSlot({
        registry,
        editorLabels: {
          placeholder: "Tweak this section in one line…",
          submit: "Apply",
          reset: "Reset",
        },
      });
    </script>
  </head>
  <body>
    <header class="shop-header">
      <span class="logo">Old Pal Shop</span>
      <nav><span>Home</span><span>Categories</span><span>Cart (2)</span></nav>
    </header>

    <!-- The legacy product section, unchanged, wrapped in ai-slot -->
    <ai-slot name="hero" src="/ai-render/hero" editable stream live>
      <h1>X100 Noise-Canceling Headphones</h1>
      <p>Good sound. Comfortable fit.</p>
    </ai-slot>

    <!-- If the recommendation AI fails, this section keeps its static content -->
    <ai-slot name="broken" src="/ai-render/broken">
      <h2>You may also like</h2>
      <p>Ear tips · Carrying case · Extended warranty</p>
    </ai-slot>
  </body>
</html>
