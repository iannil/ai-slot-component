# ai-slot Shopify 应用配置（由 shopify app config link 生成并关联）
# 文档：https://shopify.dev/docs/apps/tools/cli/configuration

name = "ai-slot"
handle = "ai-slot"
client_id = "8b9a9d4086826a13e5fe549e9351f237"
# Theme App Extension 无后台页面：embedded 必须为 false。
# application_url 为官网落地页。
application_url = "https://aislot.dev"
embedded = false

[access_scopes]
# 主题扩展无需 Admin API 权限。
scopes = ""
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[build]

[webhooks]
api_version = "2026-10"

  # 上架 App Store 的强制合规 Webhook：应用不存储任何店铺/客户数据，端点仅确认收到。
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://demo.aislot.dev/webhooks/shopify/compliance"
